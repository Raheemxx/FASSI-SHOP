<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fassi Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Jost',sans-serif; background:#0a0a0a; color:#f0ebe3; }

  .bg-text {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:0; user-select:none;
  }
  .bg-text span {
    font-family:'Playfair Display',serif;
    font-size:clamp(70px,16vw,200px);
    font-weight:700; font-style:italic;
    color:transparent;
    -webkit-text-stroke:1px rgba(201,168,76,0.06);
    white-space:nowrap; letter-spacing:-0.02em;
  }

  .page { position:relative; z-index:1; width:100vw; height:100vh; display:grid; grid-template-rows:auto 1fr auto; }

  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:1.3rem 2.5rem;
    border-bottom:1px solid rgba(201,168,76,0.1);
  }
  .logo { font-family:'Playfair Display',serif; font-size:1.6rem; font-style:italic; color:#c9a84c; }
  .top-links { display:flex; gap:1.5rem; align-items:center; }
  .top-links a { color:rgba(240,235,227,0.35); text-decoration:none; font-size:0.7rem; letter-spacing:0.22em; text-transform:uppercase; transition:color 0.3s; }
  .top-links a:hover { color:#c9a84c; }
  .top-links a.cta { color:#0a0a0a; background:#c9a84c; padding:0.5rem 1.2rem; }
  .top-links a.cta:hover { background:#e8c97a; }

  .middle { display:flex; align-items:center; position:relative; overflow:hidden; }

  .arrow {
    position:absolute; top:50%; transform:translateY(-50%); z-index:20;
    width:46px; height:46px;
    border:1px solid rgba(201,168,76,0.25);
    background:rgba(10,10,10,0.75);
    color:#c9a84c; font-size:1.2rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:border-color 0.3s, background 0.3s;
    backdrop-filter:blur(10px); user-select:none;
  }
  .arrow:hover { border-color:#c9a84c; background:rgba(201,168,76,0.1); }
  .arrow.left  { left:1.5rem; }
  .arrow.right { right:1.5rem; }

  .track-wrap { width:100%; height:100%; overflow:hidden; position:relative; }

  .track {
    display:flex; height:100%; align-items:center;
    gap:1rem; padding:1.2rem 0;
    transition:transform 0.5s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }

  .slide {
    flex-shrink:0; height:calc(100% - 1rem);
    position:relative; cursor:pointer;
    transition:opacity 0.4s, transform 0.4s;
    opacity:0.35; transform:scale(0.84);
    display:none;
  }
  .slide.active { opacity:1; transform:scale(1); }

  .slide img {
    height:100%; width:auto;
    max-width:300px; min-width:160px;
    object-fit:cover; display:block;
    border:1px solid rgba(201,168,76,0.1);
    transition:border-color 0.3s;
  }
  .slide.active img, .slide:hover img { border-color:rgba(201,168,76,0.4); }

  .slide-caption {
    position:absolute; bottom:0; left:0; right:0;
    background:linear-gradient(to top, rgba(10,10,10,0.9), transparent);
    padding:2rem 1rem 0.8rem; text-align:center;
    opacity:0; transition:opacity 0.3s;
  }
  .slide.active .slide-caption, .slide:hover .slide-caption { opacity:1; }
  .cap-name  { font-family:'Playfair Display',serif; font-size:0.85rem; margin-bottom:0.2rem; }
  .cap-price { color:#c9a84c; font-size:0.72rem; letter-spacing:0.15em; margin-bottom:0.35rem; }
  .cap-btn   { font-size:0.6rem; letter-spacing:0.25em; text-transform:uppercase; color:#c9a84c; border-bottom:1px solid rgba(201,168,76,0.35); padding-bottom:2px; }

  .dots {
    position:absolute; bottom:0.7rem; left:50%; transform:translateX(-50%);
    display:flex; gap:5px; z-index:10;
  }
  .dot { width:4px; height:4px; border-radius:50%; background:rgba(201,168,76,0.2); cursor:pointer; transition:background 0.3s, transform 0.3s; }
  .dot.active { background:#c9a84c; transform:scale(1.6); }

  .bottombar {
    display:flex; align-items:center; justify-content:space-between;
    padding:0.85rem 2.5rem;
    border-top:1px solid rgba(201,168,76,0.1);
  }
  .addr { font-size:0.67rem; letter-spacing:0.12em; color:rgba(240,235,227,0.25); text-decoration:none; transition:color 0.3s; }
  .addr:hover { color:#c9a84c; }
  .socials { display:flex; gap:0.7rem; }
  .soc { width:28px; height:28px; border:1px solid rgba(201,168,76,0.15); display:flex; align-items:center; justify-content:center; color:rgba(240,235,227,0.3); text-decoration:none; transition:border-color 0.3s, color 0.3s; }
  .soc:hover { border-color:#c9a84c; color:#c9a84c; }
  .count { font-size:0.67rem; letter-spacing:0.18em; color:rgba(240,235,227,0.2); }
  .count em { color:#c9a84c; font-style:normal; }

  @media(max-width:680px) {
    .topbar, .bottombar { padding:0.8rem 1rem; }
    .top-links a:not(.cta) { display:none; }
    .arrow.left { left:0.4rem; }
    .arrow.right { right:0.4rem; }
    .slide img { max-width:200px; min-width:130px; }
  }
</style>
</head>
<body>

<script>
  var WA    = '212698672687';
  var TOTAL = 20;
  var GAP   = 16;

  var track   = document.getElementById('track');
  var dotsEl  = document.getElementById('dots');
  var countEl = document.getElementById('count');
  var wrap    = document.querySelector('.track-wrap');

  var slides  = [];
  var current = 0;
  var timer;

  for (var n = 1; n <= TOTAL; n++) {
    (function(i) {
      var src  = 'Fassi images/' + i + '.jpeg';
      var name = 'Babouche N' + String.fromCharCode(176) + i;

      var div = document.createElement('div');
      div.className   = 'slide';
      div.dataset.idx = i;
      div.innerHTML =
        '<img src="' + src + '" alt="' + name + '">' +
        '<div class="slide-caption">' +
          '<div class="cap-name">'  + name        + '</div>' +
          '<div class="cap-price">100 DH / paire</div>' +
          '<div class="cap-btn">Appuyez pour commander</div>' +
        '</div>';

      var img = div.querySelector('img');

      img.onload = function() {
        div.style.display = 'block';
        slides.push(div);
        slides.sort(function(a, b) { return +a.dataset.idx - +b.dataset.idx; });
        buildDots();
        goTo(0, false);
      };

      img.onerror = function() { div.remove(); };

      div.addEventListener('click', function() {
        var idx = slides.indexOf(div);
        if (idx !== current) { goTo(idx); return; }
        var msg = 'Bonjour Fassi Shop! Je souhaite commander: ' + name + ' - 100 DH / paire. Merci de confirmer disponibilite et pointures.';
        window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(msg), '_blank');
      });

      track.appendChild(div);
    })(n);
  }

  function buildDots() {
    dotsEl.innerHTML = '';
    slides.forEach(function(_, i) {
      var d = document.createElement('div');
      d.className = 'dot' + (i === current ? ' active' : '');
      (function(n) { d.addEventListener('click', function() { goTo(n); }); })(i);
      dotsEl.appendChild(d);
    });
    updateCount();
  }

  function updateCount() {
    if (!slides.length) return;
    countEl.innerHTML = '<em>' + (current + 1) + '</em> / ' + slides.length;
  }

  function goTo(idx, animate) {
    if (!slides.length) return;
    if (animate === undefined) animate = true;
    current = ((idx % slides.length) + slides.length) % slides.length;

    slides.forEach(function(s, i) { s.classList.toggle('active', i === current); });

    var wrapW   = wrap.offsetWidth;
    var slideEl = slides[current];
    var slideW  = slideEl.offsetWidth;
    var offset  = 0;

    for (var i = 0; i < current; i++) {
      offset += (slides[i].offsetWidth || 200) + GAP;
    }
    offset -= (wrapW / 2) - (slideW / 2);
    if (offset < 0) offset = 0;

    if (!animate) {
      track.style.transition = 'none';
      track.style.transform  = 'translateX(-' + offset + 'px)';
      requestAnimationFrame(function() { track.style.transition = ''; });
    } else {
      track.style.transform = 'translateX(-' + offset + 'px)';
    }

    document.querySelectorAll('.dot').forEach(function(d, i) { d.classList.toggle('active', i === current); });
    updateCount();

    clearInterval(timer);
    timer = setInterval(function() { goTo(current + 1); }, 5000);
  }

  document.getElementById('prev').addEventListener('click', function() { goTo(current - 1); });
  document.getElementById('next').addEventListener('click', function() { goTo(current + 1); });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft')  goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
  });

  var tx = 0, ty = 0;
  track.addEventListener('touchstart', function(e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  track.addEventListener('touchend', function(e) {
    var dx = tx - e.changedTouches[0].clientX;
    var dy = Math.abs(ty - e.changedTouches[0].clientY);
    if (Math.abs(dx) > 40 && Math.abs(dx) > dy) goTo(dx > 0 ? current + 1 : current - 1);
  });
</script>
</body>
</html>
