<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fassi Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%;
    overflow:hidden;
    font-family:'Jost',sans-serif;
    background:#0a0a0a;
    color:#f0ebe3;
  }

  /* BG TEXT */
  .bg-text {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:0; user-select:none;
    overflow:hidden;
  }
  .bg-text span {
    font-family:'Playfair Display',serif;
    font-size:clamp(80px, 18vw, 220px);
    font-weight:700;
    font-style:italic;
    letter-spacing:-0.03em;
    color:transparent;
    -webkit-text-stroke: 1px rgba(201,168,76,0.07);
    white-space:nowrap;
    line-height:1;
    text-align:center;
  }

  /* LAYOUT */
  .page {
    position:relative; z-index:1;
    width:100vw; height:100vh;
    display:grid;
    grid-template-rows: auto 1fr auto;
    padding:0;
  }

  /* TOP BAR */
  .topbar {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.6rem 3rem;
    border-bottom:1px solid rgba(201,168,76,0.12);
  }
  .logo {
    font-family:'Playfair Display',serif;
    font-size:1.8rem;
    font-style:italic;
    color:#c9a84c;
    letter-spacing:-0.01em;
  }
  .top-links {
    display:flex; gap:1.8rem; align-items:center;
  }
  .top-links a {
    color:rgba(240,235,227,0.4);
    text-decoration:none;
    font-size:0.72rem;
    letter-spacing:0.22em;
    text-transform:uppercase;
    transition:color 0.3s;
  }
  .top-links a:hover { color:#c9a84c; }
  .top-links a.cta {
    color:#0a0a0a;
    background:#c9a84c;
    padding:0.5rem 1.2rem;
    font-size:0.7rem;
    letter-spacing:0.2em;
    transition:background 0.3s;
  }
  .top-links a.cta:hover { background:#e8c97a; }

  /* MIDDLE — CAROUSEL */
  .middle {
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    gap:0;
    overflow:hidden;
  }

  /* ARROWS */
  .arrow {
    position:absolute;
    top:50%; transform:translateY(-50%);
    z-index:10;
    width:48px; height:48px;
    border:1px solid rgba(201,168,76,0.3);
    background:rgba(10,10,10,0.6);
    color:#c9a84c;
    font-size:1.2rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color 0.3s, background 0.3s;
    backdrop-filter:blur(8px);
    user-select:none;
  }
  .arrow:hover { border-color:#c9a84c; background:rgba(201,168,76,0.1); }
  .arrow.left  { left:2rem; }
  .arrow.right { right:2rem; }

  /* IMAGE STRIP */
  .carousel-wrap {
    width:100%; height:100%;
    overflow:hidden;
    position:relative;
  }
  .carousel-strip {
    display:flex;
    height:100%;
    align-items:center;
    gap:1.2rem;
    transition:transform 0.5s cubic-bezier(.4,0,.2,1);
    padding:1.5rem 0;
    will-change:transform;
  }
  .c-slide {
    flex-shrink:0;
    height:calc(100% - 3rem);
    width:auto;
    position:relative;
    cursor:pointer;
    transition:transform 0.4s, opacity 0.4s;
    opacity:0.45;
    transform:scale(0.88);
  }
  .c-slide.active {
    opacity:1;
    transform:scale(1);
  }
  .c-slide img {
    height:100%;
    width:auto;
    max-width:340px;
    object-fit:cover;
    display:block;
    border:1px solid rgba(201,168,76,0.15);
  }
  .c-slide:hover img { border-color:rgba(201,168,76,0.5); }

  /* slide info tooltip on active */
  .slide-info {
    position:absolute;
    bottom:0; left:0; right:0;
    background:linear-gradient(to top, rgba(10,10,10,0.92), transparent);
    padding:1.5rem 1rem 0.9rem;
    text-align:center;
    opacity:0;
    transition:opacity 0.3s;
  }
  .c-slide.active .slide-info,
  .c-slide:hover .slide-info { opacity:1; }
  .slide-info-name {
    font-family:'Playfair Display',serif;
    font-size:0.95rem;
    margin-bottom:0.3rem;
  }
  .slide-info-price {
    color:#c9a84c;
    font-size:0.78rem;
    letter-spacing:0.15em;
  }
  .slide-info-cta {
    display:inline-block;
    margin-top:0.5rem;
    font-size:0.65rem;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color:#c9a84c;
    border-bottom:1px solid rgba(201,168,76,0.4);
    padding-bottom:2px;
  }

  /* DOTS */
  .dots {
    position:absolute;
    bottom:1.2rem; left:50%;
    transform:translateX(-50%);
    display:flex; gap:6px; z-index:10;
  }
  .dot {
    width:5px; height:5px;
    border-radius:50%;
    background:rgba(201,168,76,0.3);
    cursor:pointer;
    transition:background 0.3s, transform 0.3s;
  }
  .dot.active { background:#c9a84c; transform:scale(1.4); }

  /* BOTTOM BAR */
  .bottombar {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1rem 3rem;
    border-top:1px solid rgba(201,168,76,0.12);
  }
  .bottom-left {
    font-size:0.7rem;
    letter-spacing:0.15em;
    color:rgba(240,235,227,0.3);
  }
  .bottom-left a {
    color:rgba(240,235,227,0.3);
    text-decoration:none;
    transition:color 0.3s;
  }
  .bottom-left a:hover { color:#c9a84c; }
  .bottom-center {
    display:flex; gap:1rem; align-items:center;
  }
  .social-icon {
    width:32px; height:32px;
    border:1px solid rgba(201,168,76,0.2);
    display:flex; align-items:center; justify-content:center;
    color:rgba(240,235,227,0.4);
    text-decoration:none;
    transition:border-color 0.3s, color 0.3s;
  }
  .social-icon:hover { border-color:#c9a84c; color:#c9a84c; }
  .counter {
    font-size:0.7rem;
    letter-spacing:0.2em;
    color:rgba(240,235,227,0.25);
    min-width:60px;
    text-align:right;
  }
  .counter span { color:#c9a84c; }

  @media(max-width:700px) {
    .topbar { padding:1rem 1.2rem; }
    .top-links a:not(.cta) { display:none; }
    .bottombar { padding:0.8rem 1.2rem; flex-wrap:wrap; gap:0.5rem; }
    .arrow.left { left:0.5rem; }
    .arrow.right { right:0.5rem; }
    .c-slide img { max-width:220px; }
  }
</style>
</head>
<body>

<!-- BG SHADOW TEXT -->
<div class="bg-text">
  <span>Fassi&nbsp;Shop</span>
</div>

<div class="page">

  <!-- TOP -->
  <header class="topbar">
    <div class="logo">Fassi Shop</div>
    <nav class="top-links">
      <a href="https://www.instagram.com/fassi_shop?igsh=djAyZG54OGo1MzF6&utm_source=qr" target="_blank">Instagram</a>
      <a href="https://www.tiktok.com/@lfassishop0" target="_blank">TikTok</a>
      <a href="https://www.google.com/maps/search/Rue%20Lkard%209%2C%2080070%20Agadir%2C%20Maroc/@30.3999,-9.5449,17z?hl=en" target="_blank">Agadir</a>
      <a href="https://wa.me/212698672687" target="_blank" class="cta">Commander →</a>
    </nav>
  </header>

  <!-- MIDDLE CAROUSEL -->
  <main class="middle">
    <button class="arrow left" id="prevBtn">&#8592;</button>

    <div class="carousel-wrap">
      <div class="carousel-strip" id="strip"></div>
      <div class="dots" id="dots"></div>
    </div>

    <button class="arrow right" id="nextBtn">&#8594;</button>
  </main>

  <!-- BOTTOM -->
  <footer class="bottombar">
    <div class="bottom-left">
      <a href="https://www.google.com/maps/search/Rue%20Lkard%209%2C%2080070%20Agadir%2C%20Maroc/@30.3999,-9.5449,17z?hl=en" target="_blank">
        📍 Rue Lkard 9, 80070 Agadir
      </a>
    </div>
    <div class="bottom-center">
      <!-- Instagram -->
      <a class="social-icon" href="https://www.instagram.com/fassi_shop?igsh=djAyZG54OGo1MzF6&utm_source=qr" target="_blank">
        <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </a>
      <!-- TikTok -->
      <a class="social-icon" href="https://www.tiktok.com/@lfassishop0" target="_blank">
        <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.78a4.85 4.85 0 0 1-1.01-.09z"/></svg>
      </a>
      <!-- WhatsApp -->
      <a class="social-icon" href="https://wa.me/212698672687" target="_blank">
        <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
      </a>
    </div>
    <div class="counter" id="counter"><span>1</span> / 20</div>
  </footer>

</div>

<script>
  const WA = '212698672687';
  const TOTAL = 20;
  const SLIDE_W = 300; // approx display width of each card
  const GAP = 19;

  let slides = [];
  let current = 0;

  const strip = document.getElementById('strip');
  const dotsEl = document.getElementById('dots');
  const counter = document.getElementById('counter');

  // Build slides
  for (let i = 1; i <= TOTAL; i++) {
    const src = `Fassi images/${i}.jpeg`;
    const name = `Babouche N°${i}`;

    const slide = document.createElement('div');
    slide.className = 'c-slide';
    slide.dataset.src = src;
    slide.dataset.name = name;
    slide.dataset.idx = i - 1;
    slide.style.display = 'none';

    slide.innerHTML = `
      <img src="${src}" alt="${name}" loading="lazy">
      <div class="slide-info">
        <div class="slide-info-name">${name}</div>
        <div class="slide-info-price">100 DH / paire</div>
        <div class="slide-info-cta">Commander →</div>
      </div>
    `;

    const img = slide.querySelector('img');
    img.onload = () => {
      slide.style.display = 'block';
      slides.push(slide);
      rebuildDots();
      goTo(0, false);
    };
    img.onerror = () => slide.remove();

    slide.addEventListener('click', () => {
      const idx = slides.indexOf(slide);
      if (idx !== current) { goTo(idx); return; }
      // already active — open WhatsApp
      const msg = `🥿 *Fassi Shop*\n\nBonjour, je suis intéressé(e) par :\n👟 ${name}\n💰 100 DH / paire\n\nPouvez-vous confirmer la disponibilité et les pointures ? Merci !`;
      window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`, '_blank');
    });

    strip.appendChild(slide);
  }

  // Touch swipe
  let touchStartX = 0;
  strip.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX, {passive:true});
  strip.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 40) goTo(diff > 0 ? current + 1 : current - 1);
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
  });

  document.getElementById('prevBtn').onclick = () => goTo(current - 1);
  document.getElementById('nextBtn').onclick = () => goTo(current + 1);

  function rebuildDots() {
    dotsEl.innerHTML = '';
    slides.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === current ? ' active' : '');
      d.onclick = () => goTo(i);
      dotsEl.appendChild(d);
    });
  }

  function goTo(idx, animate = true) {
    if (!slides.length) return;
    current = ((idx % slides.length) + slides.length) % slides.length;

    // Mark active
    slides.forEach((s, i) => s.classList.toggle('active', i === current));

    // Center active slide in viewport
    const wrap = document.querySelector('.carousel-wrap');
    const wrapW = wrap.offsetWidth;
    const activeSlide = slides[current];
    const slideW = activeSlide.offsetWidth || SLIDE_W;

    // Calculate offset: position current slide in center
    let offset = 0;
    for (let i = 0; i < current; i++) {
      offset += (slides[i].offsetWidth || SLIDE_W) + GAP;
    }
    offset -= (wrapW / 2) - (slideW / 2);

    if (!animate) strip.style.transition = 'none';
    strip.style.transform = `translateX(${-Math.max(0, offset)}px)`;
    if (!animate) requestAnimationFrame(() => strip.style.transition = '');

    // Dots & counter
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
    counter.innerHTML = `<span>${current + 1}</span> / ${slides.length}`;
  }

  // Auto-advance
  setInterval(() => { if (slides.length > 1) goTo(current + 1); }, 5000);
</script>
</body>
</html>
